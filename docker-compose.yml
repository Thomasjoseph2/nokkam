# Local development environment.
#
#   docker compose up -d mongo mailpit      # infrastructure only (run apps on host with `pnpm dev`)
#   docker compose --profile app up         # infrastructure + api + web in containers
name: nokkam

services:
  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27018:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the single-node replica set on first boot, then reports health.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI -> http://localhost:8025

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /repo
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @nokkam/shared-types build && pnpm --filter @nokkam/api dev"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/nokkam?directConnection=true
      SMTP_HOST: mailpit
    ports:
      - '4000:4000'
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - shared_types_node_modules:/repo/packages/shared-types/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /repo
    # Waits for the api container to finish the shared install before starting.
    command: sh -c "until [ -f /repo/packages/shared-types/dist/index.js ]; do sleep 2; done && pnpm --filter @nokkam/web dev"
    env_file: .env
    environment:
      API_URL: http://api:4000
    ports:
      - '3000:3000'
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - shared_types_node_modules:/repo/packages/shared-types/node_modules
    depends_on:
      - api

volumes:
  mongo-data:
  node_modules:
  api_node_modules:
  web_node_modules:
  shared_types_node_modules:
